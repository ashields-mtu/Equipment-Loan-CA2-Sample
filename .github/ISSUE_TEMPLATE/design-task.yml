name: CA2 Design Task
description: Supporting analysis/design work linked to a story or use case
title: "TASK-XX: "
labels: ["design"]
body:
  - type: input
    id: parent
    attributes: {label: Related story/use case, placeholder: "US-01 / UC-01"}
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: Required outcome}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: Definition of Done, placeholder: "Editable source, review, links, consistency"}

name: Render PlantUML

on:
  push:
    paths:
      - "models/**/*.puml"
      - ".github/workflows/render-plantuml.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz

      - name: Download PlantUML
        run: |
          curl -L \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar \
            -o plantuml.jar

      - name: Render diagrams as SVG
        run: |
          find models -type f -name "*.puml" -print0 |
          xargs -0 java -jar plantuml.jar -tsvg

      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "models/**/*.svg"

          if git diff --cached --quiet; then
            echo "No rendered diagram changes"
          else
            git commit -m "Render PlantUML diagrams"
            git push
          fi